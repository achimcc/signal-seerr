[package]
name = "signal-seerr"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Request movies and series through Seerr from a Signal chat"
repository = "https://github.com/achimcc/signal-seerr"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
toml = "1.1.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
wiremock = "0.6.5"
