[greeting]
title = "Hi {name} — you can now request movies and series here."

[farewell]
goodbye = "I've forgotten your Signal name — enter it again in your account settings whenever you'd like to request movies and series again."

[help]
body = """
Just send me a title and I'll search for it.

/movie <title>       searches movies only
/series <title>      searches series only
1 … 5                picks from the results — and then the version
more                 shows the next results
/status              what's still on the way for you
/withdraw <number>   withdraws a request
/help                this overview
/cancel              forgets the open results list
"""

[search]
none = "I can't find anything for that."
footer = "Reply with the number. \"m\" shows more."
no_more = "There's nothing more."
kind_movie = "Movie"
kind_tv = "Series"
already = "✓ already there"

[request]
placed = "{title} is on the list. I'll let you know once it's here.\nWrong one? /withdraw {id} takes it off again."
placed_not_released = "{title} is on the list. It hasn't come out for home viewing yet — I'll let you know as soon as it's here.\nWrong one? /withdraw {id} takes it off again."
placed_with_profile = "{title} is on the list ({profile}). I'll let you know once it's here.\nWrong one? /withdraw {id} takes it off again."
profile_question = "{title} — which version? Answer with the number."
already = "{title} is already there."
seasons_question = "{title} — which seasons? \"all\", or numbers like \"1 2\"."
withdrawn = "Request {id} has been withdrawn."
unknown_id = "I don't have a request from you with the number {id}."

[status]
empty = "There's nothing of yours on the way right now."
line = "{id}: {title} — {state}"
untitled = "(untitled)"
waiting = "waiting"
available = "available"
not_handed_over = "I couldn't put it on the list"
partly_available = "part of it is here, the rest is still coming"
declined = "was declined"
not_aired = "not aired yet"
not_aired_date = "not aired yet (the first episode comes on {date})"
partly_counts = "{have} of {aired} episodes are here"
partly_complete_next = "every episode aired so far is here, the next one comes on {date}"
import_stuck = "downloaded, but stuck on the last step"
downloading = "downloading, {percent} %"
not_released = "not out for home viewing yet"
not_released_date = "not out for home viewing yet (expected from {date})"
download_failed = "one attempt failed, I'm still looking"
searching = "still looking, nothing suitable so far"
nothing_exists = "nowhere to be found so far"
only_in_languages = "so far only available in {languages}"
too_large = "so far only in versions we don't take (too big)"
too_small = "so far only in versions we don't take (too small)"
wrong_quality = "so far only in versions we don't take (picture quality)"
otherwise = "so far only in versions we don't take"

[notice]
# `{state}` is a FRAGMENT, built for `status.line` ("{id}: {title} — {state}")
# and therefore without a subject of its own. It must be introduced, not
# glued behind the title: "Der Wunsch" still looking, nothing suitable so
# far" is what that gluing produced, for the commonest case of all.
unsuitable = "About \"{title}\": {state}. I keep looking and will tell you when it is here."
unsuitable_hint = "If a different version would do: /withdraw {id}, then ask for it again and pick another version."
download_failed = "One attempt at \"{title}\" failed. I'm still looking."
import_stuck = "\"{title}\" is downloaded but stuck on the last step. Somebody needs to look at that."

[available]
ready = "\"{title}\" is here.\n{url}"
failed = "I couldn't put \"{title}\" on the list. That's the technology at this end, not the film — try again in a few minutes."

# Radarr's own English language names, as they arrive in a release's
# `languages` field. A name with no entry here is shown as Radarr sends it --
# that is an ordinary outcome, not a missing translation, since Radarr knows
# far more languages than a chat bot needs to name.
[language]
German = "German"
English = "English"
French = "French"
Spanish = "Spanish"
Italian = "Italian"
Portuguese = "Portuguese"
"Portuguese (Brazil)" = "Portuguese (Brazil)"
Japanese = "Japanese"
Korean = "Korean"
Chinese = "Chinese"
Russian = "Russian"
Dutch = "Dutch"
Swedish = "Swedish"
Danish = "Danish"
Norwegian = "Norwegian"
Polish = "Polish"
Turkish = "Turkish"

[error]
unknown_sender = "I don't know you yet. Add your Signal name at {url} under \"Your account\", then I'll get back to you."
not_allowed = "I know your account, but it's missing the group for the media library. Let {operator} know."
seerr_down = "I can't reach the request list right now. Try again in a moment."
not_understood = "I can't do anything with that. /help shows what's possible."
