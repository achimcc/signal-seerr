# signal-seerr — see README.md
signal_socket       = "/run/signal-cli/socket"
signal_account_file = "/run/credentials/signal-seerr.service/signal-account"

authentik_url        = "http://192.0.2.10:9000"
authentik_token_file = "/run/credentials/signal-seerr.service/authentik-token"

seerr_url      = "http://192.0.2.20:5055"
seerr_key_file = "/run/credentials/signal-seerr.service/seerr-key"

webhook_listen     = "0.0.0.0:8080"
webhook_token_file = "/run/credentials/signal-seerr.service/webhook-token"

state_file = "/var/lib/signal-seerr/state.json"

# How often the directory is reconciled with Authentik. The greeting arrives
# within this window; see the design doc, section 3.5.
poll_seconds = 30

# The Authentik group that a person must be in to request anything.
media_group = "Medien"

# Used in the "it is there" message.
jellyfin_url = "https://jellyfin.example.invalid"

# Where a person goes to enter their Signal name, shown to an unknown sender.
settings_url = "https://example.invalid/account"

# Who to ask when a group is missing, shown to a known but ungrouped sender.
operator_name = "the operator"

# Which quality profiles to offer after a title is chosen, BY NAME, in the
# order they are offered in. Leave it out to offer whatever Seerr lists, in
# Seerr's order -- or to ask nothing at all when it lists nothing.
#
# By name and never by id: Radarr and Sonarr keep separate id spaces, so the
# same number is a different profile on each side. In your own order and not
# Seerr's: otherwise "3" means something else the week somebody adds a
# profile, and whoever learned to type it gets a different film.
# quality_profiles = [
#   "Dual Language, then German (1080p)",
#   "Rarity, original language (SD too)",
# ]

# Read-only Radarr/Sonarr access for /status and stall notices. Optional --
# without this section the bot behaves exactly as it did before insight
# existed.
# [insight]
# radarr_url      = "https://radarr.example.invalid"
# radarr_key_file = "/run/credentials/signal-seerr.service/radarr-key"
#
# # Sonarr access is optional on top of Radarr's. sonarr_url and
# # sonarr_key_file are a pair -- one without the other is a load error.
# sonarr_url      = "https://sonarr.example.invalid"
# sonarr_key_file = "/run/credentials/signal-seerr.service/sonarr-key"
#
# # How often Radarr/Sonarr are polled for status changes, in seconds.
# poll_seconds = 600
#
# # After this many hours without progress, a request counts as stalled.
# stall_after_hours = 24
#
# # reason_search triggers ONE interactive indexer search per stalled
# # request -- never from /status. Off by default: an interactive search at
# # somebody else's indexers is something an operator switches on
# # explicitly.
# reason_search = false
#
# # A ceiling on how many of those searches run per day, once reason_search
# # is on.
# max_reason_searches_per_day = 5
#
# # Where "already told you about this" state is kept, so a stall notice is
# # not repeated every poll.
# notices_file = "/var/lib/signal-seerr/notices.json"
#
# # Profile NAME -> the languages that profile REQUIRES. Only listed
# # profiles ever get the "only in <language>" reason.
# [insight.profile_languages]
# "Dual Language, then German (1080p)" = ["German", "English"]
